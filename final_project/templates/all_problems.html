<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Актуальні запити</title>
    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121316;           /* Light black background */
            --card-bg: #1e2025;            /* Container / Card background */
            --input-bg: #16181d;           /* Input background */
            --text-main: #e2e8f0;          /* Main light text */
            --text-muted: #94a3b8;         /* Muted slate text */
            --border-color: #2e3440;       /* Dark border color */
            --accent-blue: #5c8ca8;        /* Toned-down cyan/blue */
            --accent-hover: #4b7893;       /* Hover state cyan/blue */
            --badge-bg: rgba(92, 140, 168, 0.15);
            --badge-text: #5c8ca8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2.5rem 1.5rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.75rem;
        }

        .page-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .badge-count {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
        }

        .problems-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .problem-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .problem-card:hover {
            border-color: #3b4252;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .problem-info {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .problem-info h4 {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .problem-info small {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-view {
            padding: 0.55rem 1.1rem;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--accent-blue);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-view:hover {
            background-color: var(--accent-hover);
        }

        .btn-view:active {
            transform: scale(0.99);
        }

        .empty-state {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            body {
                padding: 1.5rem 1rem;
            }

            .problem-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.85rem;
            }

            .btn-view {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="page-header">
            <h2>Актуальні запити:</h2>
            <span class="badge-count">{{ problems|length }} Pending</span>
        </div>

        <div class="problems-list">
            {% if problems %}
                {% for i in problems %}
                    <form action="/problem" class="problem-card">
                        <div class="problem-info">
                            <h4>{{ i.title }}</h4>
                            <small>{{ i.date_created }}</small>
                        </div>
                        <input type="hidden" name="problem_id" value="{{ i.id }}">
                        <button type="submit" class="btn-view">Переглянути</button>
                    </form>
                {% endfor %}
            {% else %}
                <div class="empty-state">
                    <p>Актуальних запитів немає.</p>
                </div>
            {% endif %}
        </div>
    </main>

</body>
</html>

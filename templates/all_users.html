<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Menu Check</title>
</head>
<body>

    <h2>Menu Administration</h2>
    <a href="/home">Back to Home</a>
    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.nickname }}</td>
                <td>{{ item.email }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="8">No users were found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>

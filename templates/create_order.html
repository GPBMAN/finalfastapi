<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfbfa;
            --text-main: #2c2a29;
            --accent: #bc2f26;
            --border: #e6e3de;
            --secondary-btn: #888;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
        }
        .order-card {
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 40px;
            max-width: 550px;
            width: 100%;
            position: relative;
        }
        h1.empty-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            text-align: center;
            color: #888;
            font-weight: 400;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0 0 30px 0;
        }
        li {
            padding: 15px 0;
            border-bottom: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
        }
        .btn-submit {
            width: 100%;
            background: transparent;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 15px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        .btn-submit:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
            box-shadow: 0 5px 15px rgba(188, 47, 38, 0.1);
        }
        .action-links {
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }
        .action-links a {
            flex: 1;
            text-decoration: none;
        }
        .btn-secondary {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--secondary-btn);
            padding: 12px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-secondary:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }
    </style>
</head>
<body>
<div class="order-card">
    {%if basket%}
        <ul>
            {%for position in basket%}
                <li>
                    <span>{{position}}</span>
                    <strong>× {{basket[position]}}</strong>
                </li>
            {%endfor%}
        </ul>
        
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="submit" class="btn-submit" value="Оформити замовлення">
        </form>

        <div class="action-links">
            <a href="/change_order"><button class="btn-secondary">Change order</button></a>
            <a href="/delete_basket"><button class="btn-secondary">Delete all</button></a>
        </div>
    {%else%}
        <h1 class="empty-title">Ваш список замовлень пустий</h1>
    {%endif%}
</div>
</body>
</html>

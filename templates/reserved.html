<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Bistro | Бронювання столика</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Segoe UI",sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
            color:white;
            overflow:hidden;
        }

        body::before{
            content:"";
            position:absolute;
            width:500px;
            height:500px;
            background:rgba(251,191,36,.15);
            border-radius:50%;
            top:-180px;
            right:-150px;
            filter:blur(80px);
        }

        body::after{
            content:"";
            position:absolute;
            width:400px;
            height:400px;
            background:rgba(96,165,250,.15);
            border-radius:50%;
            bottom:-150px;
            left:-120px;
            filter:blur(80px);
        }

        .container{
            position:relative;
            width:430px;
            background:rgba(255,255,255,.08);
            backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,.15);
            border-radius:22px;
            padding:35px;
            box-shadow:0 20px 50px rgba(0,0,0,.45);
            z-index:1;
        }

        h1{
            text-align:center;
            font-size:2rem;
            margin-bottom:8px;
            color:#fbbf24;
        }

        .subtitle{
            text-align:center;
            color:#d1d5db;
            margin-bottom:30px;
        }

        label{
            display:block;
            margin-bottom:8px;
            color:#f3f4f6;
            font-weight:500;
        }

        select,
        input[type="datetime-local"]{
            width:100%;
            padding:14px;
            margin-bottom:20px;
            border:none;
            border-radius:12px;
            background:rgba(255,255,255,.12);
            color:white;
            font-size:16px;
            outline:none;
            transition:.3s;
        }

        select option{
            color:black;
        }

        select:focus,
        input[type="datetime-local"]:focus{
            background:rgba(255,255,255,.18);
            box-shadow:0 0 0 3px rgba(251,191,36,.35);
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            background:linear-gradient(135deg,#f59e0b,#fbbf24);
            color:#111827;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 25px rgba(245,158,11,.45);
        }

        button:active{
            transform:scale(.98);
        }

        .message{
            margin-top:20px;
            text-align:center;
            color:#fbbf24;
            font-weight:600;
        }

        @media(max-width:500px){
            .container{
                width:92%;
                padding:25px;
            }

            h1{
                font-size:1.7rem;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌙 Luna Bistro</h1>
    <p class="subtitle">
        Забронюйте столик та насолодіться незабутнім вечором
    </p>

    <form method="post">

        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label>Тип столика</label>
        <select name="table_type">
            <option value="1-2">1–2 людини</option>
            <option value="3-4">3–4 людини</option>
            <option value="4+">Більше 4 людей</option>
        </select>

        <label>Дата та час</label>
        <input type="datetime-local" name="time" required>

        <input type="hidden" name="latitude" id="latitude">
        <input type="hidden" name="longitude" id="longitude">

        <button type="submit">Забронювати столик</button>

    </form>

    <div class="message">
        {{ message }}
    </div>

</div>

<script nonce="{{nonce}}">
window.onload = function () {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function (position) {
                document.getElementById("latitude").value = position.coords.latitude;
                document.getElementById("longitude").value = position.coords.longitude;
            },
            function (error) {
                console.error("Не вдалося отримати геолокацію:", error);
            }
        );
    } else {
        console.warn("Ваш браузер не підтримує геолокацію.");
    }
};
</script>

</body>
</html>
